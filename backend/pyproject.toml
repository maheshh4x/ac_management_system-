[tool.black]
line-length = 110
target-version = ["py310"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E501", "BLE"]
# HTTP boundary handlers deliberately catch Exception and return the error
# envelope instead of crashing — that is the design (never leak internals).
"app/routes/**" = ["BLE"]
"app/api/**" = ["BLE001"]
"app/services/**" = ["BLE001"]
"app/__init__.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == ['\"]__main__['\"]:"]
