<title>NITTTR Chennai 3D Campus</title>
<style>
:root{--bg:#eef2f5;--pn:#fff;--tx:#14263d;--mu:#5d6d80;--ac:#0d3b7a;--bd:#d5dde6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--pn:#17222f;--tx:#e6edf5;--mu:#93a3b6;--ac:#6fa8ff;--bd:#2a3a4c}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{position:relative;height:100%}
#cv{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#side{position:absolute;right:12px;top:12px;width:320px;max-width:calc(100% - 24px);background:var(--pn);border:1px solid var(--bd);border-radius:8px;z-index:10;transform:translateX(120%);transition:transform .3s cubic-bezier(0,0,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.15)}
#side.show{transform:translateX(0)}
#detail{padding:14px 16px;font-size:13px;line-height:1.5;max-height:75vh;overflow:auto}
.k{color:var(--mu);font-size:12px}
.skeleton{animation:pulse 1.5s infinite;background:var(--bd);border-radius:4px}
@keyframes pulse{0%{opacity:.6}50%{opacity:.3}100%{opacity:.6}}
#hint{position:absolute;left:12px;bottom:12px;font-size:12px;background:var(--pn);color:var(--mu);padding:6px 10px;border-radius:6px;border:1px solid var(--bd);z-index:5}
#tip{position:absolute;pointer-events:none;background:rgba(20,38,61,.92);color:#fff;font-size:13px;padding:8px 12px;border-radius:6px;opacity:0;transition:opacity .15s ease;z-index:20}
#campus-summary{position:absolute;top:12px;left:12px;background:var(--pn);padding:14px 16px;border-radius:8px;border:1px solid var(--bd);z-index:5;transition:opacity .3s;opacity:0;pointer-events:none;display:flex;gap:16px}
#campus-summary.show{opacity:1;pointer-events:auto}
#campus-summary div{display:flex;flex-direction:column}
#campus-summary b{font-size:24px;color:var(--ac);line-height:1.2}
#campus-summary span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
#campus-summary .last-up{position:absolute;bottom:-20px;left:0;white-space:nowrap;font-size:11px;color:var(--mu);text-transform:none;letter-spacing:0}
@media (max-width:760px){#side{top:auto;bottom:12px;left:12px;right:12px;width:auto;transform:translateY(130%)}#side.show{transform:none}#hint{display:none}}
</style></head><body>

el.addEventListener('pointermove',e=>{
 if(dn){const dx=e.clientX-dn.x,dy=e.clientY-dn.y;dn.x=e.clientX;dn.y=e.clientY;mv+=Math.abs(dx)+Math.abs(dy);glide=null;
  if(dn.pan){const k=rad*.0016;tg.x-=(Math.cos(th)*dx+Math.sin(th)*dy*Math.cos(ph)*-1)*k;tg.z-=(-Math.sin(th)*dx+Math.cos(th)*dy*-1*Math.cos(ph))*k}
  else{th-=dx*.006;ph=Math.min(1.45,Math.max(.15,ph-dy*.006))}place()}
 else if(e.pointerType!=='touch'){const id=pick(e);
  if(id&&id!==cur){setHover(id);const c=DATA[id],r=cv.getBoundingClientRect();
   tip.innerHTML=`<b>${items[id].n}</b><br><span>${c&&c.acs!=null?c.acs+' ACs':(dataOk?'0 ACs':'No data')}</span>`;
   tip.style.left=(e.clientX-r.left+15)+'px';tip.style.top=(e.clientY-r.top+15)+'px'}
  else setHover(null)}});
el.addEventListener('pointerup',e=>{if(mv<5){const id=pick(e);if(id)select(id);else deselect()}dn=null});
el.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(320,Math.max(30,rad*(1+Math.sign(e.deltaY)*.1)));glide=null;place()},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape')deselect()});
function size(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();place();

// ---- UI ----
function updateSum(){let t=0,n=0;Object.values(DATA).forEach(v=>{if(v&&v.acs!=null){t+=+v.acs;if(v.acs>0)n++}});
 document.getElementById('tA').textContent=t;document.getElementById('tB').textContent=n+'/19'}
function stamp(txt){let l=campusSum.querySelector('.last-up');if(!l){l=document.createElement('div');l.className='last-up';campusSum.appendChild(l)}l.textContent=txt}
function deselect(){setHover(null);
 if(cur){cur=null;all.forEach(x=>x.m.forEach(m=>[].concat(m.material).forEach(k=>{k.opacity=1;k.emissive.setHex(0)})));
  startGlide(new THREE.Vector3(OVERVIEW.tx,OVERVIEW.ty,OVERVIEW.tz),OVERVIEW.rad,OVERVIEW.th,OVERVIEW.ph)}
 sidePanel.classList.remove('show');campusSum.classList.add('show')}
function select(id){setHover(null);cur=id;const b=items[id];sidePanel.classList.add('show');campusSum.classList.remove('show');
 all.forEach(x=>x.m.forEach(m=>[].concat(m.material).forEach(k=>{if(x.id===id){k.opacity=1;k.emissive.setHex(0x112233)}else{k.opacity=.4;k.emissive.setHex(0)}})));
 startGlide(b.m[0].position,80,th,1.0);
 const c=DATA[id]||{acs:0,departments:[]};let dep='';
 if(!dataOk)dep='<div class="k" style="margin-top:8px">Data unavailable. Please refresh.</div>';
 else if(c.departments&&c.departments.length){const mx=Math.max(...c.departments.map(d=>d.acs))||1;
  dep='<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">'+c.departments.map((d,i)=>`<div><div style="font-size:12px;display:flex;justify-content:space-between;margin-bottom:2px"><span>${d.name}</span><b>${d.acs}</b></div><div style="height:6px;background:var(--bd);border-radius:3px;overflow:hidden"><div class="dep-bar" data-w="${d.acs/mx*100}" style="width:0;height:100%;background:var(--ac);transition:width .6s cubic-bezier(.2,.8,.2,1) ${i*.1}s"></div></div></div>`).join('')+'</div>'}
 else dep='<div class="k" style="margin-top:8px">'+(c.acs?'No department breakdown available for this building.':'No ACs recorded for this building.')+'</div>';
 det.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0 0 2px;font-size:15px">${b.id}. ${b.n}</h2><div class="k">Type: ${b.t}</div></div><button onclick="deselect()" aria-label="Close" style="background:none;border:none;color:var(--mu);font-size:20px;cursor:pointer">&times;</button></div>
 <div style="margin-top:14px;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--bd);text-align:center"><div class="k" style="text-transform:uppercase;letter-spacing:1px">Total ACs</div><div id="cnt" data-n="${dataOk?(c.acs||0):0}" style="font-size:36px;font-weight:bold;color:var(--ac);line-height:1;margin-top:8px">${dataOk?0:'–'}</div></div>
 <div style="margin-top:18px"><b style="display:block;border-bottom:1px solid var(--bd);padding-bottom:4px;margin-bottom:8px">Department Breakdown</b>${dep}</div>`;
 requestAnimationFrame(()=>{det.querySelectorAll('.dep-bar').forEach(x=>x.style.width=reduce?x.dataset.w+'%':x.dataset.w+'%');
  const cn=document.getElementById('cnt');if(cn&&dataOk){const tg2=+cn.dataset.n,st=performance.now();
   (function a(now){let p=reduce?1:Math.min(1,(now-st)/600);cn.textContent=Math.round(tg2*ease(p));if(p<1)requestAnimationFrame(a)})(st)}})}

function loadData(){
 det.innerHTML=Array(4).fill(0).map(()=>'<div class="skeleton" style="height:20px;margin-bottom:12px"></div>').join('');
 sidePanel.classList.add('show');campusSum.classList.remove('show');
 // Phase 3: per-block stats arrive via postMessage from the host page, which
 // holds the auth session for /api/v1 (the legacy /api/campus/buildings
 // endpoint was retired). Blocks are matched by name against the map's own B.
 addEventListener('message',e=>{
  if(e.origin!==location.origin)return;
  const d=e.data;if(!d||d.type!=='acms:stats'||!Array.isArray(d.blocks))return;
  d.blocks.forEach(s=>{const b=B.find(x=>x.n===s.name);if(b)DATA[b.id]={acs:+s.acs||0,departments:s.departments||[]}});
  dataOk=true;updateSum();
  stamp('Last updated: '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  sidePanel.classList.remove('show');campusSum.classList.add('show')});
 if(parent!==window)parent.postMessage({type:'acms:map-ready'},'*');
 setTimeout(()=>{if(!dataOk&&parent!==window)parent.postMessage({type:'acms:map-ready'},'*')},2000);
 setTimeout(()=>{if(!dataOk){stamp('Data unavailable. Please refresh.');sidePanel.classList.remove('show');campusSum.classList.add('show')}},6000)}

let last=performance.now();
(function loop(now){const dt=now-last;last=now;
 if(glide){glide.t+=dt;let p=Math.min(1,glide.t/900);const e=ease(p),s=glide.s,t=glide.e;
  th=s.th+(t.th-s.th)*e;ph=s.ph+(t.ph-s.ph)*e;rad=s.rad+(t.rad-s.rad)*e;tg.set(s.x+(t.x-s.x)*e,s.y+(t.y-s.y)*e,s.z+(t.z-s.z)*e);place();if(p>=1)glide=null}
 R.render(sc,cam);requestAnimationFrame(loop)})(performance.now());

loadData();
</script></body></html>
